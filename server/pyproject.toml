[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.12,<3.13"
dependencies = [
	"PyMuPDF>=1.24.3",
	"Flask==3.1.3",
	"Werkzeug==3.1.8",
	"gunicorn==26.2.0",
	"PyMySQL==1.1.2",
	"SQLAlchemy==2.0.43",
	"rmap @ git+https://github.com/nharrand/RMAP.git@527cf525b93adff039ab765a45604366e4d4c740",  # v1.0.2
	"cryptography==50.0.1",  # PGPy, used by rmap, needs ciphers cryptography is removing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
	"ruff>=0.12.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["S101"]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`
