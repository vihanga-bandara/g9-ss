name: Mutation testing

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"  # same as the Docker image
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      # The log names every mutant, survivors included, so it is printed only when mutmut fails.
      - run: |
          mutmut run "auth_service*" "document_service*" "watermark_service*" \
            "ghost_text*" "rmap_routes*" "auth.*" > mutmut.log 2>&1 || { tail -n 50 mutmut.log; exit 1; }
      - run: |
          mutmut export-cicd-stats
          jq -r '"| Killed | Survived | No tests | Timeout |", "|---:|---:|---:|---:|",
            "| \(.killed) | \(.survived) | \(.no_tests) | \(.timeout) |"' mutants/mutmut-cicd-stats.json >> "$GITHUB_STEP_SUMMARY"
